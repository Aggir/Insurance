name: insurance_app
description: A new Flutter project.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.6 <4.0.0"

dependencies:
  dots_indicator: "2.0.0"
  easy_localization: ^3.0.2
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.7
  go_router: ^9.0.3

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/localization/
    - assets/svgs/
  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/almarai/Almarai-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/almarai/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/almarai/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/almarai/Almarai-Light.ttf
          weight: 300
