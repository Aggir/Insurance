name: insurance_app
description: A new Flutter project.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.6 <4.0.0"

dependencies:
  barcode_finder: ^0.0.5
  bloc: ^8.1.2
  buttons_tabbar: ^1.3.7+1
  cached_network_image: ^3.3.1
  carousel_slider: ^4.2.1
  connectivity_plus: ^4.0.2
  country_code_picker: ^3.0.0
  crypto: ^3.0.3
  dartz: ^0.10.1
  dio: ^5.3.2
  dots_indicator: 2.0.0
  easy_localization: ^3.0.2
  easy_pdf_viewer: ^1.0.7
  equatable: ^2.0.5
  file_picker: ^5.3.3
  flutter:
    sdk: flutter
  flutter_advanced_segment: ^3.0.2
  flutter_bloc: ^8.1.3
  flutter_inappwebview: ^5.7.2+3
  flutter_map: ^5.0.0
  flutter_screenutil: ^5.8.4
  flutter_svg: ^2.0.7
  get_it: ^7.6.0
  go_router: ^10.0.0
  http: ^1.1.0
  intl: ^0.18.0
  pinput: ^2.2.31
  scan: ^1.6.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.1.12
  vector_math: ^2.1.4

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/localization/
    - assets/svgs/
    - assets/gifs/
  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/almarai/Almarai-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/almarai/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/almarai/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/almarai/Almarai-Light.ttf
          weight: 300
